<template id="login"><div class="lumen auth-layout"><article class="card"><header class="card-header"><h2 class="heading-md">Welcome back</h2><p class="text-muted">Sign in to your workspace.</p></header><form data-lm-validate novalidate><div class="stack"><label class="field"><span class="input-label">Email</span><input class="input" name="email" type="email" autocomplete="email" required aria-describedby="login-help login-email-error"><span class="input-help" id="login-help">Use your work email.</span><span class="input-error" id="login-email-error" hidden></span></label><label class="field"><span class="input-label">Password</span><input class="input" name="password" type="password" autocomplete="current-password" minlength="8" required aria-describedby="login-password-error"><span class="input-error" id="login-password-error" hidden></span></label><label class="check"><input type="checkbox" name="remember">Remember this device</label><button class="btn width-full" type="submit">Continue</button><output data-lm-form-status role="status"></output></div></form></article></div></template>
<template id="settings"><div class="lumen"><form class="card" data-lm-validate novalidate><header class="card-header"><h2 class="heading-md">Workspace settings</h2><p class="text-muted">Keep your profile and preferences together.</p></header><div class="grid gap-4"><label class="field col-12 md-col-6"><span class="input-label">Display name</span><input class="input" name="name" value="Alex Morgan" required aria-describedby="settings-name-error"><span class="input-error" id="settings-name-error" hidden></span></label><label class="field col-12 md-col-6"><span class="input-label">Email</span><input class="input" name="email" value="alex@example.com" type="email" required aria-describedby="settings-email-error"><span class="input-error" id="settings-email-error" hidden></span></label><label class="check switch col-12"><input type="checkbox" name="updates" checked>Product updates</label><label class="check switch col-12"><input type="checkbox" name="reports">Weekly activity report</label></div><footer class="card-footer"><button class="btn" type="submit">Save settings</button><button class="btn btn-style-outline" type="reset">Reset</button><output data-lm-form-status role="status"></output></footer></form></div></template>
<template id="dashboard"><div class="lumen"><header class="navbar"><span class="navbar-brand">Lumen workspace</span><button class="btn btn-style-outline navbar-toggle" data-lm-collapse="dashboard-links" data-lm-responsive aria-expanded="true" aria-controls="dashboard-links">Menu</button><nav class="navbar-links" id="dashboard-links" aria-label="Workspace"><a class="btn btn-style-ghost" href="#dashboard-main">Overview</a><a class="btn btn-style-ghost" href="#dashboard-activity">Activity</a></nav></header><div class="app-layout my-4"><nav class="app-sidebar" aria-label="Dashboard sections"><a href="#dashboard-main" aria-current="page">Dashboard</a><a href="#dashboard-activity">Recent activity</a></nav><div class="app-main" id="dashboard-main"><h2 class="heading-md">Your business at a glance</h2><div class="grid gap-4"><article class="card col-12 md-col-4"><h3 class="text-sm text-muted">Revenue</h3><p class="stat-value">$24,800</p><span class="badge color-success">Up 12%</span></article><article class="card col-12 md-col-4"><h3 class="text-sm text-muted">Orders</h3><p class="stat-value">312</p><span class="badge color-info">This month</span></article><article class="card col-12 md-col-4"><h3 class="text-sm text-muted">Goal</h3><p class="stat-value">78%</p><progress class="progress color-success" max="100" value="78" aria-label="Monthly goal"></progress></article><article class="card col-12" id="dashboard-activity"><h3>Recent activity</h3><ul class="list"><li>Invoice paid — Studio North</li><li>Project created — Spring collection</li><li>New team member — Jamie Lee</li></ul></article></div></div></div></div></template>
<template id="checkout"><div class="lumen"><h2 class="heading-md">Complete your order</h2><div class="checkout-layout"><form class="card" data-lm-validate data-lm-success-dialog="checkout-confirm" novalidate><h3>Delivery details</h3><div class="stack"><label class="field"><span class="input-label">Full name</span><input class="input" name="name" autocomplete="name" required aria-describedby="checkout-name-error"><span class="input-error" id="checkout-name-error" hidden></span></label><label class="field"><span class="input-label">Email</span><input class="input" name="email" type="email" autocomplete="email" required aria-describedby="checkout-email-error"><span class="input-error" id="checkout-email-error" hidden></span></label><label class="field"><span class="input-label">Address</span><textarea class="input" name="address" autocomplete="street-address" required aria-describedby="checkout-address-error"></textarea><span class="input-error" id="checkout-address-error" hidden></span></label><label class="field"><span class="input-label">Delivery</span><select class="input" name="delivery"><option>Standard delivery</option><option>Express delivery</option></select></label><button class="btn" type="submit">Review order</button></div></form><aside class="card" aria-label="Order summary"><h3>Order summary</h3><p class="price-row"><span>Workspace kit</span><strong>$49.00</strong></p><p class="price-row"><span>Delivery</span><strong>Free</strong></p><hr class="divider"><p class="price-row"><span>Total</span><strong>$49.00</strong></p><p class="input-help">Example checkout. No payment is collected.</p></aside></div><dialog class="dialog" id="checkout-confirm" aria-labelledby="checkout-confirm-title"><h3 id="checkout-confirm-title">Details ready</h3><p>Your delivery details are ready for review.</p><button class="btn" data-lm-close>Done</button></dialog></div></template>
<template id="data-management"><div class="lumen"><article class="card"><header class="toolbar"><h2 class="heading-md">Orders</h2><label class="field"><span class="input-label">Search orders</span><input class="input" type="search" data-lm-filter="orders-table" placeholder="Customer or status"></label></header><div class="table-wrap"><table class="table table-striped" id="orders-table"><caption>Recent orders</caption><thead><tr><th><input type="checkbox" data-lm-select-all="orders-table" aria-label="Select visible orders"></th><th aria-sort="none"><button data-lm-sort>Customer</button></th><th aria-sort="none"><button data-lm-sort>Total</button></th><th>Status</th></tr></thead><tbody><tr><td><input type="checkbox" aria-label="Select order for Alex"></td><td>Alex</td><td>$49</td><td><span class="badge color-success">Paid</span></td></tr><tr><td><input type="checkbox" aria-label="Select order for Jamie"></td><td>Jamie</td><td>$129</td><td><span class="badge color-warning">Pending</span></td></tr><tr><td><input type="checkbox" aria-label="Select order for Morgan"></td><td>Morgan</td><td>$89</td><td><span class="badge color-success">Paid</span></td></tr><tr><td><input type="checkbox" aria-label="Select order for Sam"></td><td>Sam</td><td>$219</td><td><span class="badge color-success">Paid</span></td></tr><tr><td><input type="checkbox" aria-label="Select order for Taylor"></td><td>Taylor</td><td>$59</td><td><span class="badge color-warning">Pending</span></td></tr><tr><td><input type="checkbox" aria-label="Select order for Zoe"></td><td>Zoe</td><td>$149</td><td><span class="badge color-success">Paid</span></td></tr></tbody></table></div><footer class="toolbar card-footer"><div class="row" data-lm-pagination data-lm-table="orders-table" data-lm-page-size="3"><button class="btn btn-style-outline" data-lm-page="previous">Previous</button><output role="status"></output><button class="btn btn-style-outline" data-lm-page="next">Next</button></div><button class="btn btn-style-tonal" data-lm-download="orders-table">Download visible rows</button></footer></article></div></template>
<template id="action-workflows"><div class="lumen stack"><article class="card" id="workflow-item"><h3>Draft proposal</h3><p>A removable item with an undo action.</p><button class="btn btn-style-tonal color-danger" data-lm-remove="workflow-item">Remove draft</button></article><div class="card"><h3>Confirm an action</h3><p>Review your choice before archiving a project.</p><button class="btn" data-lm-dialog="workflow-confirm">Review action</button><dialog class="dialog" id="workflow-confirm" aria-labelledby="workflow-title"><h3 id="workflow-title">Archive this project?</h3><p>You can keep a local copy before continuing.</p><label class="check"><input type="checkbox">Keep a local copy</label><div class="dialog-footer"><button class="btn btn-style-outline" data-lm-close>Cancel</button><button class="btn" data-lm-close data-lm-toast="Project marked for archive">Confirm</button></div></dialog></div></div></template>
