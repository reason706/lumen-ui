<template id="workspace"><div class="lumen app-shell" data-lumen-workspace>
<header class="app-header"><a class="navbar-brand" href="#workspace-home" data-workspace-view="overview"><span aria-hidden="true">✦</span> Lumen Workspace</a><div class="row"><label class="field"><span class="input-label">Theme</span><select class="input size-sm" data-workspace-theme><option value="light">Daylight</option><option value="dark">Slate dark</option><option value="oled">OLED</option><option value="cyberpunk">Cyberpunk</option><option value="obsidian">Obsidian</option><option value="arctic">Arctic</option><option value="sport">Sport</option><option value="luxury">Luxury</option></select></label><button class="btn btn-style-outline size-sm" data-workspace-view="settings">Preferences</button></div></header>
<aside class="app-sidebar"><nav class="stack" aria-label="Workspace pages"><button class="btn btn-style-ghost text-start" data-workspace-view="overview" aria-current="page">Overview</button><button class="btn btn-style-ghost text-start" data-workspace-view="records">Records</button><button class="btn btn-style-ghost text-start" data-workspace-view="files">Files</button><button class="btn btn-style-ghost text-start" data-workspace-view="settings">Settings</button></nav><p class="caption text-muted">Demo workspace. Changes stay in this browser session.</p><details><summary>Demo controls</summary><div class="stack my-4"><label class="field"><span class="input-label">Access</span><select class="input size-sm" data-workspace-access><option value="editor">Editor</option><option value="viewer">Viewer</option></select></label><label class="check"><input type="checkbox" data-workspace-failure>Fail next request</label><button class="btn btn-style-outline size-sm" data-workspace-reset>Reset demo data</button></div></details></aside>
<section class="app-content" data-workspace-main aria-label="Workspace content" tabindex="-1"></section>
<dialog class="dialog" data-workspace-editor aria-labelledby="workspace-editor-title"><header class="dialog-header"><h2 class="heading-md" id="workspace-editor-title" data-workspace-editor-title>Record</h2></header><div data-workspace-editor-body></div></dialog>
<dialog class="drawer" data-workspace-detail aria-labelledby="workspace-detail-title"><header class="dialog-header"><h2 class="heading-md" id="workspace-detail-title" data-workspace-detail-title>Record details</h2></header><div data-workspace-detail-body></div><footer class="dialog-footer"><button class="btn btn-style-outline" data-lm-close>Close details</button></footer></dialog>
<dialog class="dialog" data-workspace-confirm aria-labelledby="workspace-confirm-title"><h2 class="heading-md" id="workspace-confirm-title" data-workspace-confirm-title>Confirm action</h2><p data-workspace-confirm-message></p><footer class="dialog-footer"><button class="btn btn-style-outline" data-workspace-stay>Keep editing</button><button class="btn color-danger" data-workspace-confirm-action>Discard changes</button></footer></dialog>
</div></template>
