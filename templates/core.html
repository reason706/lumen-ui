<template id="lightbox"><div class="lm-scope"><button type="button" class="lm-btn lm-btn--outline" data-lm-dialog="artwork-lightbox">Open artwork</button><dialog class="lm-dialog" id="artwork-lightbox" aria-labelledby="artwork-title"><h2 id="artwork-title">Aurora artwork</h2><div class="lm-card lm-card--gradient lm-p-9 lm-text-center" role="img" aria-label="Abstract violet gradient artwork">✦</div><div class="lm-my-4"><button type="button" class="lm-btn lm-btn--outline" data-lm-close>Close</button></div></dialog></div></template>
<template id="settings"><div class="lm-scope"><form class="lm-card lm-stack" data-lm-validate novalidate><h3>Workspace preferences</h3><label class="lm-field">Workspace name<input name="workspace" class="lm-input" required value="Design team"></label><label class="lm-check lm-switch"><input type="checkbox" role="switch" checked> Weekly activity summary</label><label class="lm-field">Visibility<select name="visibility" class="lm-input"><option>Private</option><option>Team</option><option>Public</option></select></label><button class="lm-btn" type="submit">Save preferences</button></form></div></template>
